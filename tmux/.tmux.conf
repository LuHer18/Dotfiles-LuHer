set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g set-titles on
set -g set-titles-string "👻"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s set-clipboard on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

setw -g mode-keys vi
set -g status-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
unbind d
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation with prefix + vim keys.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation without prefix using Alt + arrows.
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Resize panes with prefix + Shift/vim direction.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

set -g status-position top
set -g status-interval 10
set -g status-style "bg=#1D1C19,fg=#c8c093"
set -g message-style "bg=#1D1C19,fg=#c4b28a"
set -g pane-border-style "fg=#282727"
set -g pane-active-border-style "fg=#737c73"

set -g window-status-separator ""
set -g window-status-style "bg=#1D1C19,fg=#c8c093"
set -g window-status-current-style "bg=#737c73,fg=#1D1C19,bold"
set -g window-status-format " #[fg=#c8c093,bg=#282727] #I #W #[default]"
set -g window-status-current-format "#[fg=#1D1C19,bg=#737c73] #I #W #[default]"

set -g status-left-length 80
set -g status-right-length 180
set -g status-left "#[fg=#1D1C19,bg=#737c73,bold] #S #[fg=#737c73,bg=#1D1C19] "
set -g status-right "#[fg=#1D1C19,bg=#737c73] #(/Users/luher/Dotfiles-LuHer/tmux/scripts/git-branch.sh '#{pane_current_path}') #[fg=#1D1C19,bg=#c4b28a] #(/Users/luher/Dotfiles-LuHer/tmux/scripts/cpu.sh) #[fg=#1D1C19,bg=#949fb5] #(/Users/luher/Dotfiles-LuHer/tmux/scripts/ram.sh) #[fg=#c8c093,bg=#1D1C19] %H:%M "
