set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

setw -g mode-keys vi
set -g status-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation with prefix + vim keys.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation without prefix using Alt + arrows.
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Resize panes with prefix + Shift/vim direction.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g message-style "bg=black,fg=green"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=green"
set -g window-status-current-style "fg=green,bold"
set -g window-status-style "fg=colour245"

set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=green,bold] #S #[default]"
set -g status-right "#[fg=yellow]#(whoami) #[fg=cyan]%Y-%m-%d #[fg=green]%H:%M "
